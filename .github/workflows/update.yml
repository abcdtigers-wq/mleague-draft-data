name: Update M-League CSV

on:
  workflow_dispatch:

  schedule:
    - cron: "0 21 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Export M-League CSV
        run: python scripts/export_mleague_csv.py

      - name: Commit updated CSV
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/mleague_results.csv

          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update M-League results"
            git push
          fi
